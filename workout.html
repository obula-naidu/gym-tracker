<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Track Workout | Fit Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <div class="track-header">
      <h1>Track Workout</h1>
      <input type="date" id="workoutDate" max="">
    </div>

    <div id="message" class="message" style="display: none;"></div>

    <div class="card" id="restTimerCard">
      <div class="card-header" style="margin-bottom:0.75rem;">
        <h2 style="margin:0;">Rest Timer</h2>
        <span id="restTimerDisplay" class="pr-badge pr-badge-large">--:--</span>
      </div>
      <div class="action-row" style="margin-top:0;">
        <button type="button" id="restStartBtn" class="btn btn-primary btn-sm">Start</button>
        <button type="button" id="restStopBtn" class="btn btn-ghost btn-sm">Stop</button>
      </div>
    </div>

    <div class="card">
      <div class="form-group">
        <label>Mode</label>
        <div class="mode-toggle" id="workoutModeToggle">
          <button type="button" id="modeGroupBtn" class="btn btn-ghost btn-sm active">Muscle Group</button>
          <button type="button" id="modeRoutineBtn" class="btn btn-ghost btn-sm">Routine</button>
        </div>
      </div>

      <div class="form-group" id="muscleGroupControl">
        <label for="muscleGroup">Muscle Group</label>
        <select id="muscleGroup">
          <option value="">Select muscle group</option>
        </select>
      </div>

      <div class="form-group" id="routineControl" style="display: none;">
        <label for="routineSelect">Routine</label>
        <select id="routineSelect">
          <option value="">Select routine</option>
        </select>
      </div>
      <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
        <a href="history.html" id="viewHistoryLink" class="btn btn-ghost btn-sm">View History</a>
        <a href="routines.html" id="createRoutineLink" class="btn btn-ghost btn-sm" style="display: none;">Create Routine</a>
      </div>
    </div>

    <div id="workoutContent">
      <div class="empty-state">
        <p>Select a muscle group to load exercises and start tracking</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="add-exercise.html">Add Exercise</a>
    <a href="workout.html" class="active">Track Workout</a>
    <a href="settings.html">Menu</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/day-defaults.js"></script>
  <script src="js/user-prefs.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/workout.js"></script>
</body>
</html>
