<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Add Exercise | Fit Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Add Exercise</h1>

    <div id="message" class="message" style="display: none;"></div>

    <div class="card">
      <form id="addExerciseForm">
        <div class="form-group">
          <label for="muscleGroup">Muscle Group</label>
          <select id="muscleGroup" required>
            <option value="">Select muscle group</option>
            <option value="Back">Back</option>
            <option value="Biceps">Biceps</option>
            <option value="Legs">Legs</option>
            <option value="Shoulders">Shoulders</option>
            <option value="Abs">Abs</option>
            <option value="Chest">Chest</option>
            <option value="Triceps">Triceps</option>
            <option value="Compound">Compound</option>
          </select>
        </div>

        <div class="form-group">
          <label for="exerciseName">Exercise Name</label>
          <input type="text" id="exerciseName" placeholder="e.g. Lat Pulldown" required>
        </div>

        <div class="form-group">
          <label for="weightMode">Tracking Mode</label>
          <select id="weightMode">
            <option value="total">Total weight</option>
            <option value="per_side">Per side</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="addBtn">Add Exercise</button>
      </form>
    </div>

    <div class="card">
      <h2>Custom Muscle Groups</h2>
      <p style="color: var(--text-secondary); margin-bottom: 1rem;">Create your own categories (e.g. Forearms, Cardio).</p>
      <div class="action-row" style="margin-top:0;">
        <input type="text" id="customGroupInput" placeholder="New muscle group" maxlength="24" style="flex:1; min-width:180px;">
        <button type="button" class="btn btn-ghost" id="addCustomGroupBtn">Add Group</button>
      </div>
      <div id="customGroupsList" style="margin-top:0.75rem;"></div>
    </div>

    <h2>Saved Exercises</h2>
    <div id="exerciseList"><div class="empty-state"><p>Select a muscle group to view saved exercises</p></div></div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="add-exercise.html" class="active">Add Exercise</a>
    <a href="workout.html">Track Workout</a>
    <a href="settings.html">Menu</a>
  </nav>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/day-defaults.js"></script>
  <script src="js/user-prefs.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/add-exercise.js"></script>
</body>
</html>
