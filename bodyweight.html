<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Body Weight | Fit Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <h1>Body Weight</h1>

    <div class="card">
      <h2>Log Today's Weight</h2>
      <form id="bodyweightForm">
        <div class="form-group">
          <label for="bwDate">Date</label>
          <input type="date" id="bwDate">
        </div>
        <div class="form-group">
          <label for="bwWeight" id="bwWeightLabel">Weight (kg)</label>
          <input type="number" id="bwWeight" step="0.1" min="20" max="500" placeholder="e.g. 75.5" inputmode="decimal">
        </div>
        <div id="bwMessage" class="message" style="display:none;"></div>
        <button type="submit" id="bwSaveBtn" class="btn btn-primary">Save</button>
      </form>
    </div>

    <div class="card">
      <h2>Progress</h2>
      <div id="bwStats" style="display:flex;gap:1.5rem;flex-wrap:wrap;margin-bottom:1rem;"></div>
      <div id="bwChartWrap" style="max-height:220px;">
        <div class="empty-state" style="padding:1rem;"><p>No data yet.</p></div>
      </div>
    </div>

    <div class="card">
      <h2>History</h2>
      <div id="bwList"><div class="empty-state"><p>No entries yet.</p></div></div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="index.html">Home</a>
    <a href="add-exercise.html">Add Exercise</a>
    <a href="workout.html">Track Workout</a>
    <a href="settings.html">Menu</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/user-prefs.js"></script>
  <script src="js/pwa.js"></script>
  <script src="js/bodyweight.js"></script>
</body>
</html>
